[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photomind"]

[project]
name = "photomind-mcp"
version = "0.1.0"
description = "Intelligent photo library management via MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3.0",
    "osxphotos>=0.75.0",
    "open-clip-torch>=2.24.0",
    "pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "numpy>=1.26.0",
    "send2trash>=1.8.0",
]

[project.scripts]
photomind-mcp = "photomind.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "macos: requires macOS (imports osxphotos / real Photos.app); deselected in Linux CI",
    "integration: requires real hardware or heavy models (CLIP weights, connected iPhone); deselected in CI",
]
